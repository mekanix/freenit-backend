[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freenit"
version = "0.1.0"
description = "Freenit Flask, HTMX, Chota, and Oxide web frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite",
  "email-validator",
  "flask",
  "oxyde",
  "passlib",
  "pydantic[email]",
  "pyjwt",
  "werkzeug",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
freenit = "freenit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["freenit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
