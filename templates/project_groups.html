<div class="container">
  <div class="header">
    <h2>{{ project.name }} groups</h2>
  </div>
  <div class="card">
    <form hx-post="/projects/{{ project.id }}/groups" hx-target="#main" hx-swap="innerHTML">
      <label>
        Name
        <input type="text" name="name" required>
      </label>
      <label>
        Description
        <input type="text" name="description">
      </label>
      <button type="submit" class="button primary">Create group</button>
    </form>
  </div>
  <div class="card">
    <div class="table-grid" style="grid-template-columns: 1fr 2fr auto;">
      <div class="heading">Name</div>
      <div class="heading">Description</div>
      <div class="heading">Actions</div>
      {% for group in groups %}
      <div class="data">{{ group.name }}</div>
      <div class="data">{{ group.description or '' }}</div>
      <div class="data"><a class="button" href="/projects/{{ project.id }}/groups/{{ group.id }}/members">Members</a></div>
      {% else %}
      <div class="data" style="grid-column: 1 / 4;">No groups yet.</div>
      {% endfor %}
    </div>
  </div>
</div>
