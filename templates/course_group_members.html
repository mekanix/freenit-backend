<div class="container">
  <div class="header">
    <h2>{{ group.name }} members</h2>
  </div>
  <div class="card">
    <form hx-post="/courses/{{ course.id }}/groups/{{ group.id }}/members" hx-target="#main" hx-swap="innerHTML">
      <label>
        User email
        <input type="email" name="email" required>
      </label>
      <button type="submit" class="button primary">Add member</button>
    </form>
  </div>
  <div class="card">
    <ul>
      {% for member in members %}
      <li>{{ member.email }}</li>
      {% else %}
      <li>No members yet.</li>
      {% endfor %}
    </ul>
  </div>
</div>
