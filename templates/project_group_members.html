<div class="container">
  <div class="header">
    <h2>{{ group.name }} members</h2>
  </div>
  <div class="card">
    <form hx-post="/projects/{{ project.id }}/groups/{{ group.id }}/members" hx-target="#main" hx-swap="innerHTML">
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <button type="submit" class="button primary">Add member</button>
    </form>
  </div>
  <div class="card">
    <div class="table-grid" style="grid-template-columns: 1fr auto;">
      <div class="heading">Email</div>
      <div class="heading">Actions</div>
      {% for member in members %}
      <div class="data">{{ member.email }}</div>
      <div class="data">{{ member.fullname or '' }}</div>
      {% else %}
      <div class="data" style="grid-column: 1 / 3;">No members yet.</div>
      {% endfor %}
    </div>
  </div>
</div>
